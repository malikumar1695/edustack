name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Services (typecheck, test, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` not `install`: installs exactly what the lockfile pins and fails
      # if the lockfile and manifests disagree. One install covers every
      # workspace — the services share a single hoisted node_modules.
      - name: Install workspace dependencies
        run: npm ci

      # Shared packages are consumed from dist/, so they build before anything
      # that imports them.
      - name: Build shared packages
        run: npm run build:packages

      # prisma/generated is gitignored build output and must be regenerated in
      # every environment. No database is contacted — this only reads the schema.
      - name: Generate Prisma clients
        run: |
          npm exec --workspace @ilm/auth-service -- prisma generate
          npm exec --workspace @ilm/academic-service -- prisma generate

      # keys/*.pem are gitignored (correctly — never commit private keys), so
      # CI mints a throwaway pair. The RS256 tests sign and verify for real.
      - name: Generate throwaway RS256 keypair
        run: |
          mkdir -p apps/auth-service/keys
          openssl genpkey -algorithm RSA -out apps/auth-service/keys/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in apps/auth-service/keys/private.pem -out apps/auth-service/keys/public.pem

      - name: Typecheck
        run: |
          npm run --workspace @ilm/auth-service typecheck
          npm run --workspace @ilm/academic-service typecheck

      # Unit tests only. The integration suite needs a real database and is
      # excluded until it runs reliably (see README known gaps).
      - name: Unit tests
        env:
          NODE_ENV: test
          LOG_LEVEL: silent
          JWT_PRIVATE_KEY_PATH: ./keys/private.pem
          JWT_PUBLIC_KEY_PATH: ./keys/public.pem
        run: |
          npm exec --workspace @ilm/auth-service -- vitest run src/
          npm exec --workspace @ilm/academic-service -- vitest run src/

      - name: Build
        run: |
          npm run --workspace @ilm/auth-service build
          npm run --workspace @ilm/academic-service build

  frontend:
    name: Admin SPA (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      # apps/admin is deliberately outside the workspace, so it installs on its own.
      - name: Install
        working-directory: apps/admin
        run: npm i

      # `tsc -b && vite build` — typechecks and bundles in one step.
      - name: Build
        working-directory: apps/admin
        run: npm run build

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      # Catches the class of failure that only appears in a container: missing
      # workspace manifests, an absent lockfile, or a native module that won't
      # compile on alpine.
      - name: Build auth-service image
        run: docker build -f apps/auth-service/Dockerfile -t ilm-auth .

      - name: Build academic-service image
        run: docker build -f apps/academic-service/Dockerfile -t ilm-academic .
